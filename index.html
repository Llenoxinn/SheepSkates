<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sheep Skate</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@450;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg-1:#f6f1e7; --bg-2:#e5dccb;
    --ink:#2b2622; --muted:#81776b;
    --panel:rgba(255,253,249,.86); --panel-line:rgba(60,45,30,.10);
    --pill:#ebe6dc; --pill-ink:#2b2622;
    --accent:#3b82f6; --accent-soft:rgba(59,130,246,.16);
    --shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 10px 30px -8px rgba(60,40,20,.28), 0 2px 6px rgba(60,40,20,.08);
    --spring:cubic-bezier(.34,1.56,.64,1);
    --out:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 38%,var(--bg-1) 0%,var(--bg-2) 100%);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
  /* paper grain + vignette for the painterly feel */
  .grain{position:fixed;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(140% 100% at 50% 45%,transparent 55%,rgba(90,60,30,.16) 100%)}

  /* HUD */
  .hud{position:fixed;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:12px}
  .brand{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--panel-line);border-radius:14px;padding:8px 14px 8px 10px;box-shadow:var(--shadow)}
  .brand .logo{width:30px;height:30px;border-radius:9px;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 1px var(--panel-line)}
  .brand h1{font:600 16px/1 Fredoka,sans-serif;margin:0;letter-spacing:.2px}
  .brand small{display:block;font:500 11px/1.2 Inter,sans-serif;color:var(--muted);margin-top:3px}
  .score{display:flex;align-items:baseline;gap:6px;margin-left:8px;padding-left:12px;border-left:1px solid var(--panel-line)}
  .score b{font:700 20px/1 Fredoka,sans-serif;font-variant-numeric:tabular-nums;display:inline-block;transition:transform .35s var(--spring)}
  .score b.bump{transform:scale(1.25) rotate(-4deg)}
  .score span{font:500 11px Inter;color:var(--muted)}
  .combo{font:700 12px Fredoka;color:#fff;background:#ff7a59;border-radius:99px;padding:2px 7px;transform:scale(0);transition:transform .3s var(--spring)}
  .combo.on{transform:scale(1)}
  .actions{pointer-events:auto;display:flex;gap:8px}
  .chipbtn{height:40px;min-width:40px;padding:0 14px;border-radius:12px;border:1px solid var(--panel-line);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);font:600 13px Inter;color:var(--ink);display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:transform .18s var(--out),background-color .18s}
  .chipbtn:hover{background:#fff}
  .chipbtn:active{transform:scale(.94)}
  .chipbtn svg{width:16px;height:16px}
  .chipbtn.icon{padding:0}
  .chipbtn.icon{justify-content:center}

  /* selection overlay */
  #sel{position:fixed;left:0;top:0;border:1.5px solid var(--accent);border-radius:2px;pointer-events:none;opacity:0;transform-origin:center;transition:opacity .18s}
  #sel.on{opacity:1;animation:selIn .38s var(--spring)}
  @keyframes selIn{from{transform:scale(1.35)}to{transform:scale(1)}}
  #sel i{position:absolute;width:7px;height:7px;background:#fff;border:1.5px solid var(--accent);border-radius:1.5px}
  #sel .tl{left:-4.5px;top:-4.5px}#sel .tr{right:-4.5px;top:-4.5px}#sel .bl{left:-4.5px;bottom:-4.5px}#sel .br{right:-4.5px;bottom:-4.5px}
  #tag{position:fixed;left:0;top:0;background:var(--accent);color:#fff;font:500 11px/1 Inter;padding:4px 7px;border-radius:5px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .18s;font-variant-numeric:tabular-nums}
  #tag.on{opacity:1}
  #tag b{font-weight:600}

  #bar{position:fixed;left:0;top:0;display:flex;align-items:center;gap:2px;padding:5px;border-radius:13px;background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--panel-line);box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateY(6px) scale(.94);transform-origin:50% 0;transition:opacity .16s,transform .32s var(--spring)}
  #bar.on{opacity:1;pointer-events:auto;transform:none}
  #bar button{position:relative;height:30px;border:0;background:transparent;border-radius:8px;padding:0 10px;font:500 12.5px Inter;color:var(--ink);cursor:pointer;transition:background-color .15s,transform .16s var(--out),color .15s}
  #bar button:hover{background:rgba(60,45,30,.06)}
  #bar button:active{transform:scale(.92)}
  #bar button:disabled{opacity:.35;cursor:default;background:transparent;transform:none}
  #bar button.ic{width:30px;padding:0;display:grid;place-items:center}
  #bar button svg{width:15px;height:15px}
  #bar .sep{width:1px;height:18px;background:var(--panel-line);margin:0 4px}
  .seg{position:relative;display:flex;gap:2px}
  .seg button{z-index:1}
  .seg button.active{font-weight:600}
  .seg .pill{position:absolute;top:0;left:0;height:30px;border-radius:8px;background:var(--pill);box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 1px 2px rgba(60,40,20,.14);transition:transform .38s var(--spring),width .38s var(--spring),opacity .2s}
  #bar button.fire{animation:fire .45s var(--out)}
  @keyframes fire{0%{background:#ffe08a;transform:scale(.9)}60%{background:#fff0c2;transform:scale(1.06)}100%{background:transparent;transform:scale(1)}}
  #bar button.del:hover{color:#d9463b;background:rgba(217,70,59,.09)}
  #bar button[data-tip]::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 9px);transform:translate(-50%,4px);background:#2b2622;color:#fff;font:500 11px/1 Inter;padding:6px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .14s,transform .2s var(--out);transition-delay:0s}
  #bar button[data-tip]:hover::after{opacity:1;transform:translate(-50%,0);transition-delay:.45s}
  .riding{display:none;align-items:center;gap:6px;font:600 12px Inter;color:#fff;background:#ff7a59;border-radius:8px;height:30px;padding:0 10px;margin-left:2px}
  .riding.on{display:inline-flex}
  .riding i{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.3}}

  /* floating text */
  .pop{position:fixed;left:0;top:0;pointer-events:none;font:700 20px/1 Fredoka,sans-serif;color:#fff;-webkit-text-stroke:5px #2b2622;paint-order:stroke fill;white-space:nowrap;animation:rise 1.15s var(--out) forwards}
  .pop.big{font-size:26px;color:#ffd35c}
  .pop.small{font-size:15px;color:#ffe9e0}
  .pop em{font-style:normal;color:#ff8a6b}
  @keyframes rise{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}18%{opacity:1;transform:translate(-50%,-90%) scale(1.15) rotate(3deg)}35%{transform:translate(-50%,-100%) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-210%) scale(.95)}}
  .bubble{position:fixed;left:0;top:0;pointer-events:none;background:#fff;color:var(--ink);font:600 14px/1 Fredoka,sans-serif;padding:7px 11px;border-radius:14px;box-shadow:0 6px 16px -6px rgba(60,40,20,.35);transform:translate(-50%,-100%);animation:bub 1.3s var(--out) forwards;white-space:nowrap}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:2px}
  @keyframes bub{0%{opacity:0;scale:.3}15%{opacity:1;scale:1.12}25%{scale:1}80%{opacity:1}100%{opacity:0;scale:.9}}

  .hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--panel-line);border-radius:12px;padding:9px 14px;box-shadow:var(--shadow);font:500 12px Inter;color:var(--muted);white-space:nowrap;transition:opacity .25s}
  .hint span{display:inline-flex;align-items:center;gap:5px}
  kbd{font:600 10.5px Inter;color:var(--ink);background:#fff;border:1px solid var(--panel-line);border-bottom-width:2px;border-radius:5px;padding:2px 5px;min-width:18px;text-align:center}
  .hint .swap{display:none}
  .hint .swap.on{display:inline-flex;gap:14px;animation:hintIn .3s var(--out)}
  @keyframes hintIn{from{opacity:0;transform:translateY(4px)}}
  @media (max-width:720px){.hint{font-size:11px;gap:10px;max-width:calc(100% - 32px);overflow:hidden}.hint .opt{display:none}.brand small{display:none}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div class="grain"></div>
<div class="vig"></div>

<div class="hud">
  <div class="brand">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="9" cy="11" r="4.2" fill="#f4efe6" stroke="#2b2622" stroke-width="1.4"/><circle cx="14" cy="10" r="4.6" fill="#f4efe6" stroke="#2b2622" stroke-width="1.4"/><ellipse cx="17.6" cy="11.6" rx="2.2" ry="2.6" fill="#3b302c"/><rect x="4" y="16.2" width="16" height="2" rx="1" fill="#ff8fa3"/><circle cx="7" cy="19.6" r="1.2" fill="#2b2622"/><circle cx="17" cy="19.6" r="1.2" fill="#2b2622"/></svg>
    </div>
    <div><h1>Sheep Skate</h1><small>Pastoral skatepark editor</small></div>
    <div class="score"><b id="score">0</b><span>style</span><span class="combo" id="combo">×2</span></div>
  </div>
  <div class="actions">
    <button class="chipbtn" id="add" title="Drop a new sheep (N)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Sheep</button>
    <button class="chipbtn icon" id="snd" title="Sound (M)" aria-label="Toggle sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z"/><path class="w1" d="M16 9a5 5 0 0 1 0 6"/><path class="w2" d="M19.4 18.4a9 9 0 0 0 0-12.8"/></svg></button>
  </div>
</div>

<div id="sel"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
<div id="tag"></div>
<div id="bar" role="toolbar" aria-label="Sheep actions">
  <div class="seg" id="seg">
    <span class="pill" id="pill"></span>
    <button data-state="idle" data-tip="Idle · 1">Idle</button>
    <button data-state="cruise" data-tip="Cruise · 2">Cruise</button>
    <button data-state="grind" data-tip="Grind the rail · 3">Grind</button>
  </div>
  <span class="riding" id="riding"><i></i>Riding</span>
  <span class="sep"></span>
  <button data-trick="ollie" data-tip="Space">Ollie</button>
  <button data-trick="kickflip" data-tip="F">Kickflip</button>
  <button data-trick="spin" data-tip="E">360</button>
  <span class="sep"></span>
  <button class="ic" id="undo" data-tip="Undo · Ctrl Z" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button class="ic" id="redo" data-tip="Redo · Ctrl Shift Z" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  <span class="sep"></span>
  <button class="ic" id="dup" data-tip="Duplicate · Ctrl D" aria-label="Duplicate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="13" height="13" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
  <button class="ic del" id="del" data-tip="Delete · Del" aria-label="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2"/></svg></button>
</div>

<div class="hint" id="hint">
  <span class="swap on" id="hintA"><span>Click a sheep to edit it</span><span class="opt">Drag to orbit</span><span class="opt">Scroll to zoom</span><span><kbd>N</kbd> new sheep</span></span>
  <span class="swap" id="hintB"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> ride</span><span><kbd>Space</kbd> ollie</span><span class="opt"><kbd>F</kbd> kickflip</span><span class="opt"><kbd>E</kbd> 360</span><span>Click grass to send</span><span class="opt"><kbd>Esc</kbd> deselect</span></span>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- helpers ---------------- */
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));
const damp = (a, b, l, dt) => a + (b - a) * (1 - Math.exp(-l * dt));
const dampA = (a, b, l, dt) => a + wrapA(b - a) * (1 - Math.exp(-l * dt));
const easeOutBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const easeInBack = k => 2.7 * k * k * k - 1.7 * k * k;
const easeIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------------- renderer / scene ---------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.32;

const camera = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, 0.1, 300);
const CAM_DIR = new THREE.Vector3(0, 25, 21).normalize();
const controls = new OrbitControls(camera, canvas);
controls.target.set(0.4, 0, 0.6);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.enablePan = false; controls.rotateSpeed = 0.55; controls.zoomSpeed = 0.8;
controls.minPolarAngle = 0.3; controls.maxPolarAngle = 1.15;
controls.minDistance = 12; controls.maxDistance = 70;
function fitCamera() {
  const a = innerWidth / innerHeight;
  const d = 42 * Math.max(1, 1.55 / a);
  camera.position.copy(controls.target).addScaledVector(CAM_DIR, d);
}
fitCamera();

scene.add(new THREE.HemisphereLight(0xfff3df, 0x6b8a48, 1.35));
const sun = new THREE.DirectionalLight(0xffebcc, 2.7);
sun.position.set(-9, 20, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -17, right: 17, top: 14, bottom: -14, near: 1, far: 60 });
sun.shadow.radius = 7; sun.shadow.blurSamples = 14; sun.shadow.bias = -0.0005;
scene.add(sun);

/* ---------------- world layout ---------------- */
const IW = 26, IH = 18;                       // island size (world units ≈ metres)
const PLAZA = { x0: -4.5, x1: 8.5, z0: -4.2, z1: 4.8 };
const POND = { x: -8.7, z: 3.3, rx: 2.5, rz: 1.75 };
const RAIL = { a: new THREE.Vector3(-0.8, 0, -2.6), b: new THREE.Vector3(4.8, 0, -2.6), top: 0.5 };
const SHEEP_SCALE = 1.25;
const RAIL_Y = RAIL.top - 0.135 * SHEEP_SCALE;               // board-group height when sliding on the rail
const G = 18;
const obstacles = [];                         // {x,z,r,h,tag,soft}

/* ---------------- painted island texture ---------------- */
function paintIsland() {
  const W = 2048, H = Math.round(W * IH / IW), ppu = W / IW;
  const P = (x, z) => [(x + IW / 2) * ppu, (z + IH / 2) * ppu];
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const m = 38, R = 150;
  const islandPath = () => { ctx.beginPath(); ctx.roundRect(m, m, W - 2 * m, H - 2 * m, R); };

  // field patches (voronoi, half res) with hedge lines between them
  const hw = W >> 1, hh = H >> 1;
  const off = document.createElement('canvas'); off.width = hw; off.height = hh;
  const octx = off.getContext('2d'); const img = octx.createImageData(hw, hh);
  const r = rng(11);
  const cols = [[134,185,75],[119,173,65],[147,194,87],[110,162,60],[160,200,98],[127,180,70],[214,190,92],[126,176,66],[142,190,80]];
  const seeds = Array.from({ length: 15 }, (_, i) => ({ x: r() * hw, y: r() * hh, c: cols[i % cols.length] }));
  seeds[2].x = hw * .86; seeds[2].y = hh * .86; seeds[2].c = [218, 192, 96]; // golden field bottom-right
  for (let y = 0; y < hh; y++) for (let x = 0; x < hw; x++) {
    const wx = x + Math.sin(y * .045) * 6 + Math.sin((x + y) * .021) * 5, wy = y + Math.cos(x * .04) * 6;
    let d1 = 1e9, d2 = 1e9, c = null;
    for (const s of seeds) { const d = (wx - s.x) ** 2 + (wy - s.y) ** 2; if (d < d1) { d2 = d1; d1 = d; c = s.c; } else if (d < d2) d2 = d; }
    const edge = Math.sqrt(d2) - Math.sqrt(d1);
    const n = (Math.random() - .5) * 14;
    const i = (y * hw + x) * 4;
    if (edge < 2.6) { img.data[i] = 62 + n; img.data[i + 1] = 118 + n; img.data[i + 2] = 44 + n; }
    else { img.data[i] = c[0] + n; img.data[i + 1] = c[1] + n; img.data[i + 2] = c[2] + n; }
    img.data[i + 3] = 255;
  }
  octx.putImageData(img, 0, 0);
  ctx.save(); islandPath(); ctx.clip();
  ctx.imageSmoothingEnabled = true; ctx.drawImage(off, 0, 0, W, H);

  // painterly grass strokes
  ctx.lineCap = 'round';
  const strokeCols = ['rgba(58,105,38,.32)', 'rgba(158,205,96,.32)', 'rgba(104,160,56,.3)', 'rgba(210,226,128,.22)', 'rgba(80,130,46,.28)'];
  for (let i = 0; i < 16000; i++) {
    const x = rand(0, W), y = rand(0, H), a = -Math.PI / 2 + rand(-.6, .6), l = rand(4, 10);
    ctx.strokeStyle = pick(strokeCols); ctx.lineWidth = rand(1.4, 2.6);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); ctx.stroke();
  }
  // dirt paths
  const path = (pts, w) => {
    const draw = (lw, col) => { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(...P(...pts[0])); ctx.bezierCurveTo(...P(...pts[1]), ...P(...pts[2]), ...P(...pts[3])); ctx.stroke(); };
    draw(w * ppu + 8, 'rgba(120,150,60,.5)'); draw(w * ppu, '#d8bf8a'); draw(w * ppu * .45, '#e8d6a8');
  };

  else selRing.material.opacity = damp(selRing.material.opacity, 0, 10, dt);
  for (let i = markers.length - 1; i >= 0; i--) { const mk = markers[i]; mk.t += dt; const k = mk.t / .8; mk.m.scale.setScalar(1 + k * 2.2); mk.m.material.opacity = (1 - k) * .9; if (k >= 1) { scene.remove(mk.m); markers.splice(i, 1); } }

  renderer.render(scene, camera);
  updateOverlay(dt);
  for (const b of bubbles) placeBubble(b);
  requestAnimationFrame(frame);
}
syncBar();
requestAnimationFrame(frame);
if (location.hash === '#demo') setTimeout(() => select(sheepList[0]), 1500);
</script>
